<div class="app-layout">
    <app-hero></app-hero>

    <div class="workspace" id="builder-section">
        <!-- Persistent Header / Navbar -->
        <header class="topbar">
            <div class="topbar-row">
                <div class="brand">
                    <span class="brand-mark">
                        <img src="favicon.svg" alt="MyAML Logo">
                    </span>
                    <div class="brand-text">
                        <div class="brand-title">MyAML <span class="brand-accent">Laboratory</span></div>
                        <div class="brand-sub">// modeling laboratory</div>
                    </div>
                    <a href="release-notes" target="_blank" rel="noopener" class="update-pill"
                        [attr.aria-label]="'View last update (' + latestVersion + '), opens in a new tab'">
                        <span class="update-pill-dot" aria-hidden="true"></span>
                        <span>changelog</span>
                        <i class="pi pi-arrow-up-right" aria-hidden="true"></i>
                    </a>
                </div>

                <button type="button" class="btn btn-danger btn-sm" (click)="reset()">
                    <i class="pi pi-refresh" aria-hidden="true"></i>
                    <span>reset</span>
                </button>
            </div>

            <div class="tabs" role="tablist" aria-label="Builder steps">
                @for (tab of tabs; track tab.id) {
                    <button type="button" role="tab" class="tab" [id]="'tab-' + tab.id"
                        [class.is-active]="activeTab === tab.id" [attr.aria-selected]="activeTab === tab.id"
                        [attr.aria-controls]="'panel-' + tab.id" [tabindex]="activeTab === tab.id ? 0 : -1"
                        (click)="selectTab(tab.id)" (keydown)="onTabKeydown($event)">
                        <span class="tab-num">{{ tab.num }}</span> {{ tab.file }}
                    </button>
                }
            </div>
        </header>

        <main class="workspace-body">
            @if (activeTab === 'blueprint') {
                <div role="tabpanel" id="panel-blueprint" aria-labelledby="tab-blueprint" class="panel">
                    <app-schema-builder></app-schema-builder>
                </div>
            } @else {
                <div role="tabpanel" id="panel-editor" aria-labelledby="tab-editor" class="panel">
                    <div class="view-switch" role="group" aria-label="Choose what to show">
                        <button type="button" class="view-btn" [class.is-active]="editorView === 'data'"
                            [attr.aria-pressed]="editorView === 'data'" (click)="editorView = 'data'">
                            <i class="pi pi-pencil" aria-hidden="true"></i> data
                        </button>
                        <button type="button" class="view-btn" [class.is-active]="editorView === 'json'"
                            [attr.aria-pressed]="editorView === 'json'" (click)="editorView = 'json'">
                            <i class="pi pi-code" aria-hidden="true"></i> output.json
                        </button>
                    </div>

                    <div class="editor-grid" [attr.data-view]="editorView">
                        <!-- Left Panel: Dynamic Form -->
                        <div class="editor-form">
                            <app-form-editor></app-form-editor>
                        </div>
                        <!-- Right Panel: Real-time Preview -->
                        <aside class="editor-preview">
                            <app-preview></app-preview>
                        </aside>
                    </div>
                </div>
            }
        </main>

        <!-- IDE-style status bar -->
        @let s = status;
        <footer class="statusbar" aria-label="Status">
            <span class="sb-state" [class.is-bad]="!s.ok">{{ s.ok ? '✓' : '✗' }} {{ s.label }}</span>
            @for (m of s.meta; track $index) {
                <span class="sb-meta">{{ m }}</span>
            }
            <span class="sb-spacer"></span>
            <span class="sb-meta sb-file">{{ s.file }} · utf-8</span>
        </footer>
    </div>
</div>
