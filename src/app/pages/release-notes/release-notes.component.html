<div class="release-page">
    <header class="release-header">
        <div class="release-header-inner">
            <a href="./" class="brand" aria-label="MyAML Laboratory home">
                <span class="logo-icon">
                    <img src="favicon.svg" alt="">
                </span>
                <span class="brand-text">MyAML <span class="logo-accent">Laboratory</span></span>
            </a>
            <a href="./" class="back-link" (click)="backToBuilder($event)">
                <i class="pi pi-arrow-left" aria-hidden="true"></i>
                <span>Back to Builder</span>
            </a>
        </div>
    </header>

    <main class="release-main">
        <h1 class="release-title">Release Note</h1>
        <p class="release-subtitle">What's new and improved in MyAML Laboratory.</p>

        <section *ngFor="let note of notes; let first = first" class="release-card fade-in"
            [class.latest]="first" [attr.aria-labelledby]="'v-' + note.version">
            <h2 class="release-version" [id]="'v-' + note.version">
                <span class="version-label">Version {{ note.version }}</span>
                <span class="version-date">({{ formatDate(note.date) }})</span>
                <span *ngIf="first" class="latest-badge">Latest</span>
            </h2>

            <ol class="section-list">
                <li *ngFor="let section of note.sections">
                    <span class="section-title">{{ section.title }} :</span>
                    <ul class="item-list">
                        <li *ngFor="let item of section.items">{{ item }}</li>
                    </ul>
                </li>
            </ol>
        </section>
    </main>
</div>
