<section class="term-window preview-container" aria-label="JSON output">
    <header class="term-titlebar">
        <span class="term-dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="term-filename">output.json</span>
        <span class="term-comment title-comment">// json architect output</span>
        <span class="title-actions">
            <button type="button" class="icon-btn" (click)="copyToClipboard()" pTooltip="Copy to clipboard"
                tooltipPosition="bottom" aria-label="Copy JSON to clipboard">
                <i class="pi pi-copy"></i>
            </button>
            <button type="button" class="icon-btn" (click)="downloadJson()" pTooltip="Download JSON"
                tooltipPosition="bottom" aria-label="Download JSON file">
                <i class="pi pi-download"></i>
            </button>
        </span>
    </header>

    <div class="preview-content" tabindex="0" role="region" aria-label="Generated JSON, read only">
        <ol class="code">
            <li *ngFor="let line of lines; let n = index; let last = last; trackBy: trackByIndex" class="code-line"
                [class.is-flagged]="line.flagged" [attr.title]="line.flagged ? 'Required field is empty' : null">
                <span class="ln" aria-hidden="true">{{ n + 1 }}</span>
                <span class="lc"><span *ngFor="let tk of line.tokens; trackBy: trackByIndex" [class]="'tk-' + tk.kind">{{ tk.text }}</span><span *ngIf="last" class="cursor" aria-hidden="true"></span></span>
            </li>
        </ol>
    </div>

    <footer class="preview-footer">
        <span *ngIf="flaggedCount === 0" class="ok-text">✓ valid JSON · ready to copy</span>
        <span *ngIf="flaggedCount > 0" class="err-text">✗ {{ flaggedCount }} required {{ flaggedCount === 1 ? 'field is' : 'fields are' }} empty (highlighted)</span>
    </footer>
</section>
